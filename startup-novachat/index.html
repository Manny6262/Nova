<!DOCTYPE html>
<html>
<head>
    <title>Nova AI</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            max-width: 800px;
            margin: auto;
            padding: 30px;
        }

        #chat {
            border: 1px solid #444;
            height: 500px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .user {
            color: #7dd3fc;
            margin: 10px 0;
        }

        .nova {
            color: #a7f3d0;
            margin: 10px 0;
        }

        input {
            width: 78%;
            padding: 12px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Nova AI</h1>

<div id="chat"></div>

<input id="message" placeholder="Talk to Nova..." />
<button onclick="sendMessage()">Send</button>

<script>

async function sendMessage() {

    const input = document.getElementById("message")
    const chat = document.getElementById("chat")

    const message = input.value

    if (!message) return

    chat.innerHTML += `
        <div class="user">
            <b>You:</b> ${message}
        </div>
    `

    input.value = ""

    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: message
        })
    })

    const data = await response.json()

    chat.innerHTML += `
        <div class="nova">
            <b>Nova:</b> ${data.reply}
        </div>
    `

    chat.scrollTop = chat.scrollHeight
}

document.getElementById("message")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage()
        }

    })

</script>

</body>
</html>
